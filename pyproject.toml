[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-datacenter-research"
version = "0.1.0"
description = "Thermal architecture for orbital data centers: heat rejection in vacuum."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Orbital Data Center Research" }]
keywords = ["thermal", "radiator", "spacecraft", "semiconductor", "vacuum", "datacenter"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "scipy>=1.11",
    "sympy>=1.12",
    "pydantic>=2.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "nbformat>=5.9"]

[tool.setuptools]
packages = ["simulations", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
